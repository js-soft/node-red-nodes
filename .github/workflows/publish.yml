name: Publish NPM Packages

on:
  push:
    tags:
      - "*@*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Parse tag
        id: parse_tag
        run: |
          TAG="${{ github.ref_name }}"
          # Extract package name and version from tag like "eudiplo@1.0.0" or "eudiplo@1.0.0-beta.1"
          if [[ $TAG =~ ^([a-z0-9-]+)@([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            PACKAGE_NAME="${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[2]}"

            echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "package_dir=packages/node-red-$PACKAGE_NAME" >> $GITHUB_OUTPUT
            echo "Package: $PACKAGE_NAME, Version: $VERSION"
          else
            echo "Invalid tag format. Expected format: 'package-name@x.y.z' or 'package-name@x.y.z-prerelease'"
            exit 1
          fi

      - name: Verify package exists
        run: |
          if [ ! -d "${{ steps.parse_tag.outputs.package_dir }}" ]; then
            echo "Package directory not found: ${{ steps.parse_tag.outputs.package_dir }}"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        working-directory: ${{ steps.parse_tag.outputs.package_dir }}
        run: npm ci

      - name: Update package version
        working-directory: ${{ steps.parse_tag.outputs.package_dir }}
        run: |
          TARGET_VERSION="${{ steps.parse_tag.outputs.version }}"
          CURRENT_VERSION="$(node -p "require('./package.json').version")"

          if [ "$CURRENT_VERSION" = "$TARGET_VERSION" ]; then
            echo "Package version already matches tag ($TARGET_VERSION), skipping npm version."
          else
            npm version "$TARGET_VERSION" --no-git-tag-version
          fi

      - name: Publish to npm
        working-directory: ${{ steps.parse_tag.outputs.package_dir }}
        run: npx enhanced-publish --if-possible --use-preid-as-tag --access public
